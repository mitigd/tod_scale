; tod_scale.asi configuration
;
; The Typing of the Dead is hard-wired to 640x480.  This plugin rewrites the
; screen-size globals/immediates and the engine's video-mode list in memory so
; the game boots at whatever size you put here.
;
; The engine only knows about 640x480 and 320x240 (for 8/16/24/32 bpp).  Any
; target size works as long as the DirectDraw wrapper in the game folder
; advertises it in EnumDisplayModes (the current wrapper does).
[TodScale]

; target resolution
width=1920
height=1200

; mode to replace.  Leave at the game's default 640x480 unless you know the
; binary differs.
source_width=640
source_height=480

; patch the engine's static video-mode list (0x5eb6c8): every 640x480 entry
; becomes the target size.  Keep this on so in-game mode changes agree.
patch_modes=1

; write the screen-width/height globals directly as well as the immediates.
write_globals=1

; Scale the 2D layer (HUD, text, rain).  The engine draws it with screen-space
; vertices at hard-coded 640x480 pixel coordinates, so without this it stays
; stuck in the top-left corner.
;   0 = off
;   1 = stretch to fill the screen (x * target/source, y * target/source)
;   2 = uniform, scale by the height ratio (keeps sprites square, centred)
hud_scale=1

; Explicit multipliers.  0 = auto (derived from width/height above).
; e.g. hud_scale_x=3 and hud_scale_y=2.5 reproduces hud_scale=1 for 1920x1200.
hud_scale_x=0
hud_scale_y=0
